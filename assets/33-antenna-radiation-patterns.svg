<circle cx="560" cy="160" r="5" fill="#000" stroke="#000" stroke-width="1"/>
<text x="710" y="164.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">strong beam</text>
<text x="700" y="296.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">signal focused one way</text>
