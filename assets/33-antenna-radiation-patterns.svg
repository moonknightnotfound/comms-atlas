<text x="230" y="26.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Omnidirectional (whip)</text>
<circle cx="230" cy="160" r="50" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="6 4"/>
<circle cx="230" cy="160" r="95" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="6 4"/>
<path d="M242.0,160.0 L342.0,160.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
