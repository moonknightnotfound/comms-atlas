<path d="M221.5,151.5 L150.8,80.8" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M230.0,148.0 L230.0,48.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M238.5,151.5 L309.2,80.8" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<circle cx="230" cy="160" r="5" fill="#000" stroke="#000" stroke-width="1"/>
<text x="230" y="296.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">signal goes all around</text>
<text x="700" y="26.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Directional (Yagi / dish)</text>
