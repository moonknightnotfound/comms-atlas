<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="180" viewBox="0 0 1110 180" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Antenna in a wireless link</title>
<desc id="d">An electric signal goes to a transmitting antenna, travels as radio waves, is caught by a receiving antenna and becomes an electric signal again.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<rect x="0" y="0" width="1110" height="180" fill="#fff"/>
<rect x="35" y="50" width="150" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="110" y="86.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Electric</text>
<text x="110" y="104.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">signal</text>
<rect x="235" y="50" width="130" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="300" y="86.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Antenna</text>
<text x="300" y="104.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">transmitting</text>
<rect x="465" y="50" width="190" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="560" y="86.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Radio waves</text>
<text x="560" y="104.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">travel through space</text>
<rect x="755" y="50" width="130" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="820" y="86.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Antenna</text>
<text x="820" y="104.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">receiving</text>
<rect x="925" y="50" width="150" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="1000" y="86.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Electric</text>
<text x="1000" y="104.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">signal</text>
<path d="M185.0,90.0 L235.0,90.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M365.0,90.0 L465.0,90.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M655.0,90.0 L755.0,90.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M885.0,90.0 L925.0,90.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
