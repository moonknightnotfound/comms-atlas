<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Why modulation: sharing the spectrum</title>
<desc id="d">Without modulation all voices overlap at the same low frequency. With modulation each station gets its own carrier frequency.</desc>
