<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Block diagram of a modulator</title>
<desc id="d">A message signal and a high-frequency carrier wave enter a modulator, which outputs a modulated signal that goes to the antenna.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<rect x="0" y="0" width="960" height="330" fill="#fff"/>
<rect x="35" y="25" width="190" height="70" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="130" y="56.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Message signal</text>
<text x="130" y="74.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">voice, data</text>
<rect x="35" y="225" width="190" height="70" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="130" y="256.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Carrier wave</text>
<text x="130" y="274.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">high frequency</text>
<rect x="335" y="125" width="170" height="70" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="420" y="164.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">MODULATOR</text>
<rect x="575" y="125" width="170" height="70" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="660" y="164.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Modulated signal</text>
<rect x="815" y="125" width="110" height="70" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="870" y="164.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Antenna</text>
<path d="M225.0,60.0 L420.0,60.0 L420.0,125.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M225.0,260.0 L420.0,260.0 L420.0,195.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M505.0,160.0 L575.0,160.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
