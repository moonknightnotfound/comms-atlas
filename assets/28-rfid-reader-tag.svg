<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">RFID reader and tag exchange</title>
<desc id="d">The reader sends a radio signal asking who the tag is; the tag replies with its ID by backscatter; the reader passes the ID to a computer or database.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<rect x="0" y="0" width="900" height="340" fill="#fff"/>
<rect x="40" y="40" width="220" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="150" y="76.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">READER</text>
<text x="150" y="94.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">with antenna</text>
<rect x="640" y="40" width="220" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="750" y="76.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">TAG</text>
<text x="750" y="94.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">chip + antenna</text>
<rect x="20" y="225" width="260" height="90" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="150" y="257.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Computer / Database</text>
<text x="150" y="275.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">opens the door, charges the</text>
<text x="150" y="292.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">toll, logs stock</text>
<path d="M260.0,62.0 L640.0,62.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<text x="450" y="50.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">radio waves: &quot;Who are you?&quot;</text>
<path d="M640.0,98.0 L260.0,98.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<text x="450" y="122.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">backscatter: &quot;I&#x27;m ID 1234&quot;</text>
<path d="M150.0,120.0 L150.0,225.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
