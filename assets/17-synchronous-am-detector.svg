<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Synchronous AM detector</title>
<desc id="d">An AM signal is multiplied by a local carrier, then low-pass filtered to recover the message.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<rect x="0" y="0" width="880" height="310" fill="#fff"/>
<rect x="35" y="65" width="150" height="70" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="110" y="104.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">AM signal</text>
<rect x="265" y="65" width="150" height="70" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="340" y="104.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Multiplier</text>
<rect x="495" y="65" width="170" height="70" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="580" y="104.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Low Pass Filter</text>
<rect x="725" y="65" width="130" height="70" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="790" y="104.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Message</text>
<rect x="245" y="200" width="190" height="70" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="340" y="231.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Local carrier</text>
<text x="340" y="249.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">same frequency</text>
<path d="M185.0,100.0 L265.0,100.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M415.0,100.0 L495.0,100.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M665.0,100.0 L725.0,100.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M340.0,200.0 L340.0,135.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
