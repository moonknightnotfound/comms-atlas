<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Wireless communication link</title>
<desc id="d">A sender with an antenna transmits radio waves to a receiver with an antenna.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<rect x="0" y="0" width="900" height="160" fill="#fff"/>
<rect x="65" y="40" width="170" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="150" y="76.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Sender</text>
<text x="150" y="94.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">+ antenna</text>
<rect x="350" y="40" width="200" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="450" y="76.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Radio waves</text>
<text x="450" y="94.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">through air or space</text>
<rect x="665" y="40" width="170" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="750" y="76.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Receiver</text>
<text x="750" y="94.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">+ antenna</text>
<path d="M235.0,80.0 L350.0,80.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M550.0,80.0 L665.0,80.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
