<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Antenna length and wavelength</title>
<desc id="d">A dipole is half a wavelength long and a monopole is a quarter wavelength long. For FM at 100 MHz the wavelength is 3 m, so a quarter-wave antenna is about 75 cm.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<rect x="0" y="0" width="900" height="270" fill="#fff"/>
<text x="140" y="26.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Dipole (half-wave)</text>
<path d="M140.0,50.0 L140.0,120.0" fill="none" stroke="#000" stroke-width="5"/>
<path d="M140.0,136.0 L140.0,206.0" fill="none" stroke="#000" stroke-width="5"/>
<path d="M140.0,120.0 L100.0,120.0" fill="none" stroke="#000" stroke-width="1"/>
<path d="M140.0,136.0 L100.0,136.0" fill="none" stroke="#000" stroke-width="1"/>
<text x="90" y="132.2" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">to radio</text>
<path d="M180.0,50.0 L180.0,206.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M145.0,50.0 L186.0,50.0" fill="none" stroke="#000" stroke-width="0.75"/>
<path d="M145.0,206.0 L186.0,206.0" fill="none" stroke="#000" stroke-width="0.75"/>
<text x="192" y="132.55" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#000">lambda / 2</text>
<text x="440" y="26.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Monopole / whip (quarter-wave)</text>
<path d="M380.0,206.0 L500.0,206.0" fill="none" stroke="#000" stroke-width="3"/>
<path d="M384.0,206.0 L376.0,218.0" fill="none" stroke="#000" stroke-width="0.75"/>
<path d="M396.0,206.0 L388.0,218.0" fill="none" stroke="#000" stroke-width="0.75"/>
<path d="M408.0,206.0 L400.0,218.0" fill="none" stroke="#000" stroke-width="0.75"/>
<path d="M420.0,206.0 L412.0,218.0" fill="none" stroke="#000" stroke-width="0.75"/>
<path d="M432.0,206.0 L424.0,218.0" fill="none" stroke="#000" stroke-width="0.75"/>
<path d="M444.0,206.0 L436.0,218.0" fill="none" stroke="#000" stroke-width="0.75"/>
<path d="M456.0,206.0 L448.0,218.0" fill="none" stroke="#000" stroke-width="0.75"/>
<path d="M468.0,206.0 L460.0,218.0" fill="none" stroke="#000" stroke-width="0.75"/>
<path d="M480.0,206.0 L472.0,218.0" fill="none" stroke="#000" stroke-width="0.75"/>
<path d="M492.0,206.0 L484.0,218.0" fill="none" stroke="#000" stroke-width="0.75"/>
<path d="M440.0,206.0 L440.0,128.0" fill="none" stroke="#000" stroke-width="5"/>
<path d="M440.0,206.0 L440.0,232.0" fill="none" stroke="#000" stroke-width="1"/>
<text x="440" y="251.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">to radio</text>
<path d="M480.0,128.0 L480.0,206.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M445.0,128.0 L486.0,128.0" fill="none" stroke="#000" stroke-width="0.75"/>
<text x="492" y="171.55" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#000">lambda / 4</text>
<rect x="655" y="65" width="230" height="130" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="770" y="109.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Example: FM at 100 MHz</text>
<text x="770" y="127.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">lambda = 300 / 100 = 3 m</text>
<text x="770" y="144.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">half-wave: 1.5 m</text>
<text x="770" y="161.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">quarter-wave: about 75 cm</text>
</svg>
