<rect x="30" y="50" width="120" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="90" y="94.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Antenna</text>
<rect x="176" y="50" width="120" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="236" y="77.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">RF Amplifier</text>
<text x="236" y="95.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">boosts weak</text>
<text x="236" y="112.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">signal</text>
<rect x="322" y="50" width="120" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="382" y="77.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Mixer</text>
<text x="382" y="95.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">shifts to fixed</text>
<text x="382" y="112.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">frequency</text>
<rect x="468" y="50" width="120" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="528" y="77.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">IF Amplifier</text>
<text x="528" y="95.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">boosts and</text>
<text x="528" y="112.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">filters</text>
<rect x="614" y="50" width="120" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="674" y="77.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Demodulator</text>
<text x="674" y="95.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">extracts</text>
<text x="674" y="112.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">message</text>
<rect x="760" y="50" width="120" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="820" y="94.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Audio Amp</text>
<rect x="906" y="50" width="120" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="966" y="94.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Speaker</text>
