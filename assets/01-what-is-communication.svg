<text x="450" y="84.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">voice, video, text, data</text>
<rect x="680" y="30" width="200" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="780" y="66.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Receiver</text>
<text x="780" y="84.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">person or device</text>
