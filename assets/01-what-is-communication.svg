<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">What is communication</title>
<desc id="d">Information such as voice, video, text and data moves from a sender to a receiver. Everyday examples are phone calls, TV, FM radio, Wi-Fi and Bluetooth, and a metro card tap.</desc>
