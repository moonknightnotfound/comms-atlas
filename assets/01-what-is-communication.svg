<text x="120" y="66.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Sender</text>
<text x="120" y="84.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">person or device</text>
