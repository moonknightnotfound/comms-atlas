<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">HackRF One signal chain</title>
<desc id="d">Antenna to HackRF One, over USB to a computer running GNU Radio, then to an output such as audio or a plot.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<rect x="0" y="0" width="1000" height="220" fill="#fff"/>
<rect x="40" y="55" width="140" height="90" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="110" y="104.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Antenna</text>
<rect x="245" y="55" width="190" height="90" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="340" y="87.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">HackRF One</text>
<text x="340" y="105.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">digitises the</text>
<text x="340" y="122.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">radio signal</text>
<rect x="505" y="55" width="230" height="90" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="620" y="87.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Computer with GNU Radio</text>
<text x="620" y="105.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">does demodulation and</text>
<text x="620" y="122.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">processing in software</text>
<rect x="795" y="55" width="170" height="90" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="880" y="96.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Output</text>
<text x="880" y="114.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">audio, plot</text>
<path d="M180.0,100.0 L245.0,100.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M435.0,100.0 L505.0,100.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<text x="470" y="94.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">USB</text>
<path d="M735.0,100.0 L795.0,100.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
