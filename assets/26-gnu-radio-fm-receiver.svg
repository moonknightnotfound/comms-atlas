<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Basic FM receiver in GNU Radio</title>
<desc id="d">Osmocom Source tuned to 100.0 MHz feeds a low pass filter, WBFM Receive, a rational resampler and an audio sink, with a QT GUI frequency sink showing the spectrum.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<rect x="0" y="0" width="1100" height="300" fill="#fff"/>
<rect x="35" y="35" width="170" height="90" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="120" y="67.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Osmocom Source</text>
<text x="120" y="85.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">HackRF, tuned</text>
<text x="120" y="102.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">to 100.0 MHz</text>
<rect x="255" y="35" width="170" height="90" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="340" y="67.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Low Pass Filter</text>
<text x="340" y="85.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">keeps only one</text>
<text x="340" y="102.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">station</text>
<rect x="475" y="35" width="170" height="90" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="560" y="76.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">WBFM Receive</text>
<text x="560" y="94.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">FM demodulator</text>
<rect x="695" y="35" width="170" height="90" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="780" y="76.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Rational Resampler</text>
<text x="780" y="94.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">converts to 48 kHz</text>
<rect x="915" y="35" width="170" height="90" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="1000" y="76.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Audio Sink</text>
<text x="1000" y="94.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">speakers</text>
<rect x="15" y="195" width="210" height="70" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="120" y="226.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">QT GUI Frequency Sink</text>
<text x="120" y="244.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">shows the spectrum live</text>
<path d="M205.0,80.0 L255.0,80.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M425.0,80.0 L475.0,80.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M645.0,80.0 L695.0,80.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M865.0,80.0 L915.0,80.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M120.0,125.0 L120.0,195.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
