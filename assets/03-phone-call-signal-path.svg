<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Signal path of a phone call</title>
<desc id="d">Voice goes through a microphone, modulator, amplifier and antenna, travels as radio waves, then passes through an antenna, amplifier, demodulator and speaker to the listener.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<rect x="0" y="0" width="1000" height="430" fill="#fff"/>
<rect x="15" y="30" width="170" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="100" y="74.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Your voice</text>
<rect x="215" y="30" width="170" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="300" y="57.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Microphone</text>
<text x="300" y="75.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">weak, low-frequency</text>
<text x="300" y="92.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">electrical signal</text>
<rect x="415" y="30" width="170" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="500" y="57.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Modulator</text>
<text x="500" y="75.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">puts signal on a</text>
<text x="500" y="92.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">fast carrier wave</text>
<rect x="615" y="30" width="170" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="700" y="66.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Amplifier</text>
<text x="700" y="84.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">makes it strong</text>
<rect x="815" y="30" width="170" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="900" y="57.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Antenna</text>
<text x="900" y="75.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">electricity to</text>
<text x="900" y="92.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">radio waves</text>
<rect x="815" y="187" width="170" height="56" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="900" y="211.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Radio waves</text>
<text x="900" y="229.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">travel through air</text>
<rect x="815" y="320" width="170" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="900" y="347.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Antenna</text>
<text x="900" y="365.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">radio waves back to</text>
<text x="900" y="382.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">tiny electricity</text>
<rect x="615" y="320" width="170" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="700" y="356.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Amplifier</text>
<text x="700" y="374.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">boosts weak signal</text>
<rect x="415" y="320" width="170" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="500" y="347.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Demodulator</text>
<text x="500" y="365.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">removes the carrier,</text>
<text x="500" y="382.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">keeps the voice</text>
<rect x="215" y="320" width="170" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="300" y="364.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Speaker</text>
<rect x="15" y="320" width="170" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="100" y="356.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Friend hears</text>
<text x="100" y="374.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">your voice</text>
<path d="M185.0,70.0 L215.0,70.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M385.0,70.0 L415.0,70.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M585.0,70.0 L615.0,70.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M785.0,70.0 L815.0,70.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M900.0,110.0 L900.0,187.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M900.0,243.0 L900.0,320.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M815.0,360.0 L785.0,360.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M615.0,360.0 L585.0,360.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M415.0,360.0 L385.0,360.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M215.0,360.0 L185.0,360.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
