<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">RFID frequency bands</title>
<desc id="d">LF 125 to 134 kHz, HF 13.56 MHz and UHF 860 to 960 MHz with typical range and use.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<rect x="0" y="0" width="900" height="220" fill="#fff"/>
<text x="60" y="24.2" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#000">Low frequency</text>
<text x="840" y="24.2" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#000">High frequency</text>
<path d="M60.0,40.0 L840.0,40.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="25" y="75" width="250" height="110" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="150" y="109.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">LF</text>
<text x="150" y="127.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">125-134 kHz</text>
<text x="150" y="144.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">range: about 10 cm</text>
<text x="150" y="161.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">pet chips, old access cards</text>
<rect x="325" y="75" width="250" height="110" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="450" y="109.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">HF</text>
<text x="450" y="127.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">13.56 MHz</text>
<text x="450" y="144.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">range: 10 cm to 1 m</text>
<text x="450" y="161.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">metro cards, NFC, library</text>
<rect x="625" y="75" width="250" height="110" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="750" y="109.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">UHF</text>
<text x="750" y="127.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">860-960 MHz</text>
<text x="750" y="144.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">range: up to about 10 m</text>
<text x="750" y="161.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">toll tags, warehouse tracking</text>
</svg>
