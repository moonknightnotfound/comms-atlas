<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Why modulation: antenna size</title>
<desc id="d">A 3 kHz voice signal needs a quarter-wave antenna of about 25 km, while the same voice on a 100 MHz carrier needs about 75 cm.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<rect x="0" y="0" width="900" height="220" fill="#fff"/>
<rect x="20" y="50" width="340" height="120" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="190" y="89.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Voice sent directly</text>
<text x="190" y="107.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">frequency: about 3 kHz</text>
<text x="190" y="124.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">wavelength: about 100 km</text>
<text x="190" y="141.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">quarter-wave antenna: 25 km</text>
<rect x="540" y="50" width="340" height="120" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="710" y="89.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Voice on a 100 MHz carrier</text>
<text x="710" y="107.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">frequency: 100 MHz</text>
<text x="710" y="124.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">wavelength: 3 m</text>
<text x="710" y="141.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">quarter-wave antenna: 75 cm</text>
<path d="M360.0,110.0 L540.0,110.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<text x="450" y="104.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">modulation</text>
</svg>
