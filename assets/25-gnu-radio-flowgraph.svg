<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="170" viewBox="0 0 1100 170" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Generic GNU Radio flowgraph</title>
<desc id="d">Source, filter, demodulator, resampler and sink blocks connected in a chain.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<rect x="0" y="0" width="1100" height="170" fill="#fff"/>
<rect x="35" y="43" width="170" height="84" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="120" y="72.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">SOURCE</text>
<text x="120" y="90.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">HackRF, file,</text>
<text x="120" y="107.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">or simulation</text>
<rect x="255" y="43" width="170" height="84" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="340" y="72.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">FILTER</text>
<text x="340" y="90.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">picks the</text>
<text x="340" y="107.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">station</text>
<rect x="475" y="43" width="170" height="84" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="560" y="81.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">DEMODULATOR</text>
<text x="560" y="99.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">e.g. WBFM Receive</text>
<rect x="695" y="43" width="170" height="84" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="780" y="72.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">RESAMPLER</text>
<text x="780" y="90.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">adjusts the</text>
<text x="780" y="107.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">sample rate</text>
<rect x="915" y="43" width="170" height="84" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="1000" y="81.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">SINK</text>
<text x="1000" y="99.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">audio or graph</text>
<path d="M205.0,85.0 L255.0,85.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M425.0,85.0 L475.0,85.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M645.0,85.0 L695.0,85.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M865.0,85.0 L915.0,85.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
