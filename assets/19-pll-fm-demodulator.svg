<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">PLL-based FM demodulator</title>
<desc id="d">FM signal goes through a phase detector and low pass filter to give the demodulated message; the filter output also drives a VCO whose output is fed back to the phase detector.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<rect x="0" y="0" width="960" height="310" fill="#fff"/>
<rect x="30" y="55" width="140" height="70" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="100" y="94.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">FM signal</text>
<rect x="235" y="55" width="170" height="70" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="320" y="94.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Phase Detector</text>
<rect x="465" y="55" width="170" height="70" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="550" y="94.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Low Pass Filter</text>
<rect x="715" y="55" width="170" height="70" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="800" y="86.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Demodulated</text>
<text x="800" y="104.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">message</text>
<rect x="435" y="215" width="230" height="70" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="550" y="246.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">VCO</text>
<text x="550" y="264.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">voltage-controlled oscillator</text>
<path d="M170.0,90.0 L235.0,90.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M405.0,90.0 L465.0,90.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M635.0,90.0 L715.0,90.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M550.0,125.0 L550.0,215.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<text x="558" y="174.2" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">control voltage</text>
<path d="M435.0,250.0 L320.0,250.0 L320.0,125.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<text x="310" y="194.2" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">VCO output fed back</text>
</svg>
