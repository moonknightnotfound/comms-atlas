<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">PM demodulator block diagram</title>
<desc id="d">A PM signal and a recovered reference carrier enter a phase detector, followed by a low pass filter that outputs the message.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<rect x="0" y="0" width="900" height="300" fill="#fff"/>
<rect x="40" y="55" width="140" height="70" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="110" y="94.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">PM signal</text>
<rect x="245" y="55" width="170" height="70" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="330" y="94.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Phase Detector</text>
<rect x="475" y="55" width="170" height="70" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="560" y="94.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Low Pass Filter</text>
<rect x="715" y="55" width="130" height="70" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="780" y="94.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Message</text>
<rect x="215" y="205" width="230" height="60" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="330" y="239.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Carrier recovery / PLL</text>
<path d="M180.0,90.0 L245.0,90.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M415.0,90.0 L475.0,90.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M645.0,90.0 L715.0,90.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M330.0,205.0 L330.0,125.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<text x="340" y="172.2" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">reference carrier</text>
<text x="340" y="190.2" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">(same frequency, phase locked)</text>
</svg>
