<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">How RFID works step by step</title>
<desc id="d">Reader sends a signal, the tag antenna catches the energy, the chip is powered by it, the chip replies with its ID by backscatter, and the reader decodes the ID.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<rect x="0" y="0" width="1000" height="170" fill="#fff"/>
<rect x="15" y="35" width="170" height="100" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="100" y="72.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">1. Reader</text>
<text x="100" y="90.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">sends out a</text>
<text x="100" y="107.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">radio signal</text>
<rect x="215" y="35" width="170" height="100" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="300" y="72.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">2. Tag antenna</text>
<text x="300" y="90.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">catches that</text>
<text x="300" y="107.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">energy</text>
<rect x="415" y="35" width="170" height="100" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="500" y="72.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">3. Chip powered</text>
<text x="500" y="90.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">by that energy</text>
<text x="500" y="107.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">(no battery)</text>
<rect x="615" y="35" width="170" height="100" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="700" y="72.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">4. Chip replies</text>
<text x="700" y="90.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">with its ID by</text>
<text x="700" y="107.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">backscatter</text>
<rect x="815" y="35" width="170" height="100" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="900" y="72.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">5. Reader decodes</text>
<text x="900" y="90.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">the ID, sends it to</text>
<text x="900" y="107.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">the computer</text>
<path d="M185.0,85.0 L215.0,85.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M385.0,85.0 L415.0,85.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M585.0,85.0 L615.0,85.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M785.0,85.0 L815.0,85.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
