<svg xmlns="http://www.w3.org/2000/svg" width="930" height="190" viewBox="0 0 930 190" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">The radio spectrum</title>
<desc id="d">From low to high frequency: long wave, AM, FM and TV, cellular, Wi-Fi, satellite and light. Not to scale.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<rect x="0" y="0" width="930" height="190" fill="#fff"/>
<text x="20" y="24.2" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#000">Low frequency</text>
<text x="910" y="24.2" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#000">High frequency</text>
<path d="M20.0,40.0 L910.0,40.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="13" y="65" width="124" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
