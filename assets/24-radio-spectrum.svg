<text x="75" y="119.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">kHz</text>
<rect x="143" y="65" width="124" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
