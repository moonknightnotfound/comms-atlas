<text x="205" y="119.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">MHz</text>
<rect x="273" y="65" width="124" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="335" y="101.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">FM / TV</text>
<text x="335" y="119.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">100 MHz</text>
