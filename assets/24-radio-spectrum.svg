<text x="465" y="119.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">GHz</text>
<rect x="533" y="65" width="124" height="80" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="595" y="101.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Wi-Fi</text>
<text x="595" y="119.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">2.4 / 5 GHz</text>
