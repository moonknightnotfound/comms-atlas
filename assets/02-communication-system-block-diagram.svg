<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Block diagram of a communication system</title>
<desc id="d">Information source, input transducer and transmitter send a signal through a channel affected by noise to a receiver, output transducer and destination.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<rect x="0" y="0" width="900" height="380" fill="#fff"/>
<rect x="35" y="22" width="230" height="76" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="150" y="56.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Information source</text>
<text x="150" y="74.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">voice, video...</text>
<rect x="335" y="22" width="230" height="76" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="450" y="56.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Input transducer</text>
<text x="450" y="74.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">mic, camera to electric</text>
<rect x="635" y="22" width="230" height="76" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="750" y="47.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Transmitter</text>
<text x="750" y="65.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">Encoder + Modulator</text>
<text x="750" y="82.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">+ Amplifier</text>
<rect x="335" y="152" width="230" height="76" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="450" y="186.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Noise</text>
<text x="450" y="204.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">unwanted disturbance</text>
<rect x="635" y="152" width="230" height="76" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="750" y="186.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Channel</text>
<text x="750" y="204.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">wire / air / fiber / space</text>
<rect x="635" y="282" width="230" height="76" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="750" y="307.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Receiver</text>
<text x="750" y="325.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">Amplifier + Demodulator</text>
<text x="750" y="342.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">+ Decoder</text>
<rect x="335" y="282" width="230" height="76" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="450" y="316.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Output transducer</text>
<text x="450" y="334.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">speaker, screen</text>
<rect x="35" y="282" width="230" height="76" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="150" y="316.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#000">Destination</text>
<text x="150" y="334.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">person / device</text>
